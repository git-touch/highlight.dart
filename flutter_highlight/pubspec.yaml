name: flutter_highlight
description: >-
  Flutter widget for syntax highlighting powered by a Dart port of highlight.js.
  Renders code as a native TextSpan tree with theme support and line numbers.
version: 0.7.0
publish_to: none
homepage: https://github.com/pd4d10/highlight.dart
repository: https://github.com/pd4d10/highlight.dart/tree/main/flutter_highlight

environment:
  sdk: ^3.8.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  highlight:
    path: ../highlight

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed tool highlight flutter_highlight

  generated:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Regenerate code
        run: dart run tool/generate.dart --no-verify

      - name: Check for generated diffs
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Analyze highlight
        working-directory: highlight
        run: dart analyze

      - name: Analyze flutter_highlight
        working-directory: flutter_highlight
        run: flutter analyze

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Test highlight smoke suite
        working-directory: highlight
        run: dart test -r expanded test/smoke_test.dart

      - name: Test highlight markup fixtures
        working-directory: highlight
        run: dart test -r expanded test/integration/markup_test.dart

      - name: Test highlight detect fixtures
        working-directory: highlight
        run: dart test -r expanded test/integration/detect_test.dart

      - name: Test flutter_highlight
        working-directory: flutter_highlight
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests in flutter_highlight; skipping."
          fi

  pub_score:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Dry-run highlight publish
        working-directory: highlight
        run: dart pub publish --dry-run

      - name: Dry-run flutter_highlight publish
        working-directory: flutter_highlight
        run: flutter pub publish --dry-run

      - name: Activate pana
        run: dart pub global activate pana 0.23.12

      - name: Check pub.dev score gates
        run: dart run tool/check_pub_score.dart
